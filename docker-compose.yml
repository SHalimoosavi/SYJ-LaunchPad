services:
  postgres:
    image: postgres:17-alpine
    container_name: syj-launchpad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: syj
      POSTGRES_PASSWORD: syj
      POSTGRES_DB: syj_launchpad
    ports:
      - "5432:5432"
    volumes:
      - syj_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syj -d syj_launchpad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syj_postgres_data:
