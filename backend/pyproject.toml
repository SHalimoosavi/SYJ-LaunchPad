[project]
name = "syj-launchpad-backend"
version = "0.1.0"
description = "SYJ LaunchPad backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "siwe>=4.4",
    # siwe bundles a grammar (grammars/rfc5234.py) that redefines the core
    # ABNF rule 'ALPHA'. abnf<2.9.0 only warned about this
    # (GrammarWarning); abnf>=2.9.0 turns it into a hard GrammarError,
    # breaking every import of `siwe` transitively (auth routes, health
    # routes, everything) on a genuinely fresh install. siwe's own
    # dependency spec (abnf<3,>=2.2) is too loose to protect against this
    # upstream incompatibility, so we pin it here until siwe ships a fix.
    # Reproduced directly: a clean `pip install -e ".[dev]"` on 2026-09-15
    # pulled abnf 2.9.0 (the current PyPI latest) and failed with
    # `GrammarError: 'ALPHA' is a core rule from RFC 5234 appendix B...`.
    "abnf<2.9.0",
    "eth-account>=0.13",
    "web3>=7.4",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` in a default argument is the documented,
# idiomatic dependency-injection pattern, not the footgun this rule targets.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app"]
