name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syj
          POSTGRES_PASSWORD: syj
          POSTGRES_DB: syj_launchpad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syj -d syj_launchpad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0000000000
      DATABASE_URL: postgresql+asyncpg://syj:syj@localhost:5432/syj_launchpad
      DATABASE_URL_SYNC: postgresql+psycopg2://syj:syj@localhost:5432/syj_launchpad
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict .
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-build-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  contracts:
    name: Contracts (Hardhat + Foundry + Slither)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git --no-commit

      - run: forge build
      - run: forge test -vv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Slither
        run: pip install slither-analyzer

      - name: Slither static analysis
        run: |
          # See contracts/scripts/run-slither.sh: skips cleanly (exit 0,
          # not a failure) until src/ has real contract source, then
          # activates itself automatically — no future CI edit needed.
          bash scripts/run-slither.sh
